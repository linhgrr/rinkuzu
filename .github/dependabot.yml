version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      stryker:
        patterns:
          - '@stryker-mutator/*'
        update-types:
          - major
          - minor
          - patch
      gate-pinned-tools:
        patterns:
          - jscpd
          - '@redocly/cli'
          - prettier
          - react-doctor
          - knip
          - '@lhci/cli'
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Ho_Chi_Minh
    groups:
      codeql:
        patterns:
          - 'github/codeql-action*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Ho_Chi_Minh
