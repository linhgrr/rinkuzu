name: Frontend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  MONGODB_URI: mongodb://localhost:27017/test
  NEXTAUTH_SECRET: test-nextauth-secret-at-least-32-characters
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:8000
  SESSION_MAX_AGE_SECONDS: '28800'
  SESSION_UPDATE_AGE_SECONDS: '3600'
  AUTH_LOCKOUT_MAX_ATTEMPTS: '5'
  AUTH_LOCKOUT_WINDOW_MINUTES: '15'
  AUTH_LOCKOUT_DURATION_MINUTES: '15'
  ADAPTIVE_PROXY_TIMEOUT_MS: '60000'
  INTERNAL_SERVICE_TOKEN: test-token
  OBJECT_STORAGE_ENDPOINT_EXTERNAL: https://localhost
  OBJECT_STORAGE_REGION: auto
  OBJECT_STORAGE_ADDRESSING_STYLE: path
  OBJECT_STORAGE_ACCESS_KEY: test
  OBJECT_STORAGE_SECRET_KEY: test
  OBJECT_STORAGE_BUCKET: test
  MAIL_FROM: noreply@example.com
  RESEND_API_KEY: re_test_key
  PAYOS_CLIENT_ID: test-payos-client-id
  PAYOS_API_KEY: test-payos-api-key
  PAYOS_CHECKSUM_KEY: test-payos-checksum-key
  NEXT_IMAGE_UNOPTIMIZED: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Pin npm version
        run: npm i -g npm@10.9.8

      - name: Show toolchain versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Adaptive contract check
        run: |
          if [ -d ../rinkuzu-ai-api ]; then
            npm run check:adaptive-contract
          else
            echo "Skipping adaptive contract check: sibling backend repo not present in this checkout."
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage gate)
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

  react-doctor:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Pin npm version
        run: npm i -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: React Doctor
        run: npm run check:react-doctor

  perf-advisory:
    needs: quality
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Pin npm version
        run: npm i -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Perf advisory
        run: npm run perf:fe

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-fe
          path: perf/fe-*.json
          if-no-files-found: warn
