name: Node environment
description: >
  Node, npm and the installed dependency graph, plus the incremental build
  caches when a job compiles or type-checks. Factored out of fourteen jobs that
  each carried the same four steps, so the pinned Node, the pinned npm and the
  cache keys have one definition instead of fourteen that could drift apart.

inputs:
  build-caches:
    description: >
      Restore the incremental compiler caches as well. Only for jobs that
      type-check or build — `.next/cache` is large, and restoring it into a job
      that never compiles costs time and returns nothing.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Pin npm
      shell: bash
      run: npm install --global npm@10.9.8

    # Keyed on the lockfile alone, with no restore-keys: a dependency graph that
    # partially matches the lockfile is not the graph the lockfile describes, and
    # `npm ci` on a miss is the correct answer rather than a slower one.
    - name: Restore the dependency graph
      id: dependency-graph
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - name: Install exact dependency graph
      if: steps.dependency-graph.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # These do carry restore-keys, because each tool validates its own cache: tsc
    # re-checks what changed against the recorded file versions, and Next and
    # ESLint do the same. A near-miss is a head start, not a wrong answer.
    - name: Restore the compiler caches
      if: inputs.build-caches == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .cache/tsbuildinfo
          .cache/eslint
          .next/cache
        key: compiler-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          compiler-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          compiler-${{ runner.os }}-
