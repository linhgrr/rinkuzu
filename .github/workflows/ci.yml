name: Production CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  MONGODB_URI: mongodb://127.0.0.1:27017/rinkuzu_ci
  AUTH_SECRET: test-auth-secret-at-least-32-characters
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: true
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
  SESSION_MAX_AGE_SECONDS: '28800'
  SESSION_UPDATE_AGE_SECONDS: '3600'
  AUTH_LOCKOUT_MAX_ATTEMPTS: '5'
  AUTH_LOCKOUT_WINDOW_MINUTES: '15'
  AUTH_LOCKOUT_DURATION_MINUTES: '15'
  ADAPTIVE_PROXY_TIMEOUT_MS: '60000'
  INTERNAL_SERVICE_TOKEN: rinkuzu-ci-fixture-0123456789abcdef-token
  OBJECT_STORAGE_ENDPOINT_EXTERNAL: https://localhost
  OBJECT_STORAGE_REGION: auto
  OBJECT_STORAGE_ADDRESSING_STYLE: path
  OBJECT_STORAGE_ACCESS_KEY: test
  OBJECT_STORAGE_SECRET_KEY: test
  OBJECT_STORAGE_BUCKET: test
  MAIL_FROM: noreply@example.com
  RESEND_API_KEY: re_test_key
  PAYOS_CLIENT_ID: test-payos-client-id
  PAYOS_API_KEY: test-payos-api-key
  PAYOS_CHECKSUM_KEY: test-payos-checksum-key
  NEXT_IMAGE_UNOPTIMIZED: 'false'

jobs:
  actionlint:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Lint workflows
        uses: devops-actions/actionlint@467e2ce19b2310e93c9ffa0b50fe31f86b5a7f23

  policy:
    name: Fail-closed policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Verify toolchain
        run: npm run check:toolchain

      - name: Verify CI security policy
        run: npm run check:ci-security

      - name: Verify live repository governance
        run: npm run check:governance -- --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify vendored adaptive contract
        run: npm run check:adaptive-contract

      - name: Verify test integrity
        run: npm run check:test-integrity

      - name: Run repository quality tests
        run: npm run test:quality

      - name: Verify database DDL boundary
        run: npm run check:database-ddl

      - name: Verify runtime dependency cycles
        run: npm run check:runtime-cycles

      - name: Verify required E2E inventory
        run: npm run check:required-e2e-flows

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint application and architecture
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck application
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Typecheck declaration compatibility
        if: ${{ !cancelled() }}
        run: npm run typecheck:declarations

      - name: Typecheck operational scripts
        if: ${{ !cancelled() }}
        run: npm run typecheck:scripts

      - name: Enforce duplicate-code regression gate
        if: ${{ !cancelled() }}
        run: npm run check:duplication

      - name: Upload duplicate-code evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: duplication-${{ github.sha }}
          path: reports/jscpd
          if-no-files-found: error
          retention-days: 7

  unit-coverage:
    name: Unit and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Run unit tests with instrumentation
        run: npm run test:unit

      - name: Enforce global, critical, and changed-line coverage
        if: ${{ !cancelled() }}
        run: npm run check:coverage
        env:
          COVERAGE_BASE_REF: origin/master

      - name: Upload immutable coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  mutation:
    name: Critical mutation
    runs-on: ubuntu-24.04
    # Full campaigns have a 3h process timeout; leave setup/evidence headroom
    # while preventing a stuck worker tree from consuming the 6h Actions default.
    timeout-minutes: 210
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Run authoritative mutation gate
        env:
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Invoke the wrapper script directly (not `npm run`) so package-script hijack cannot redirect CI.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/run-mutation-gate.mjs --mode full
          else
            BASE_REF="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
            if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
              # Empty/all-zero/unresolvable push base: run full rather than under-scoping via HEAD^.
              node scripts/run-mutation-gate.mjs --mode full
            else
              node scripts/run-mutation-gate.mjs --mode changed --base-ref "$BASE_REF"
            fi
          fi

      - name: Upload mutation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-${{ github.sha }}
          path: reports/mutation
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  architecture:
    name: React architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Run React Doctor
        run: npm run check:react-doctor

      - name: Detect production dead code
        if: ${{ !cancelled() }}
        run: npm run check:dead-code

  integration:
    name: Integration and index contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/rinkuzu_ci?replicaSet=rs0&directConnection=true
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Start pinned MongoDB replica set
        run: bash scripts/ci-mongodb.sh start

      - name: Run integration tests
        run: npm run test:integration

      - name: Generate fresh index plan
        run: npm run --silent migrate:performance-indexes:plan > /tmp/index-plan.json
        env:
          DOTENV_CONFIG_QUIET: 'true'

      - name: Create localhost-only CI approval
        id: index-plan
        run: |
          plan_sha="$(node scripts/database/create-ephemeral-index-approval.mjs \
            /tmp/index-plan.json /tmp/index-approval.json)"
          printf 'sha=%s\n' "$plan_sha" >> "$GITHUB_OUTPUT"

      - name: Apply and verify the exact approved plan
        run: >-
          npm run migrate:performance-indexes:apply --
          --plan-sha "${{ steps.index-plan.outputs.sha }}"
          --approval-file /tmp/index-approval.json

      - name: Verify idempotency twice
        run: |
          npm run migrate:performance-indexes:verify
          npm run migrate:performance-indexes:verify

      - name: Verify query shapes with executionStats
        run: npm run check:database-query-plans

      - name: Stop MongoDB
        if: ${{ always() }}
        run: bash scripts/ci-mongodb.sh stop

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build-identity.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Start pinned MongoDB replica set
        run: bash scripts/ci-mongodb.sh start

      - name: Build once
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Compute production build identity
        id: build-identity
        run: |
          digest="$(node --input-type=module -e \
            "import { computeNextBuildDigest } from './scripts/run-lighthouse.mjs'; process.stdout.write(computeNextBuildDigest())")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-production-${{ github.sha }}
          path: .next
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

      - name: Stop MongoDB
        if: ${{ always() }}
        run: bash scripts/ci-mongodb.sh stop

  e2e:
    name: Production E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Start pinned MongoDB replica set
        run: bash scripts/ci-mongodb.sh start

      - name: Download the production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: next-production-${{ github.sha }}
          path: .next

      - name: Verify build identity
        run: |
          actual="$(node --input-type=module -e \
            "import { computeNextBuildDigest } from './scripts/run-lighthouse.mjs'; process.stdout.write(computeNextBuildDigest())")"
          test "$actual" = "${{ needs.build.outputs.digest }}"

      - name: Install pinned browser matrix
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Run production E2E suite
        id: production_e2e
        run: npm run test:e2e

      - name: Upload E2E evidence
        if: ${{ !cancelled() && steps.production_e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Stop MongoDB
        if: ${{ always() }}
        run: bash scripts/ci-mongodb.sh stop

  performance:
    name: Controlled performance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PERF_MODE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'pr' || 'release' }}
      PERF_RUNNER_CLASS: controlled
      PERF_REUSE_BUILD: '1'
      PERF_EXPECTED_BUILD_DIGEST: ${{ needs.build.outputs.digest }}
      LIGHTHOUSE_PORT: '3000'
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Start pinned MongoDB replica set
        run: bash scripts/ci-mongodb.sh start

      - name: Resolve immutable performance baseline
        id: performance-base
        run: |
          base_sha="$(git rev-parse "${GITHUB_SHA}^1")"
          git cat-file -e "${base_sha}^{commit}"
          printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Build base commit and record route sizes
        env:
          PERF_BASE_SHA: ${{ steps.performance-base.outputs.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          base_dir="${RUNNER_TEMP}/rinkuzu-performance-base"
          git worktree add --detach "$base_dir" "$PERF_BASE_SHA"
          npm ci --prefix "$base_dir"
          npm run build --prefix "$base_dir"
          npm run perf:size-baseline -- \
            --root-dir "$base_dir" \
            --config "$GITHUB_WORKSPACE/.size-limit.json" \
            --output "$GITHUB_WORKSPACE/.performance-baseline/route-sizes.json" \
            --commit-sha "$PERF_BASE_SHA"

      - name: Download the production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: next-production-${{ github.sha }}
          path: .next

      - name: Verify build identity
        run: |
          actual="$(node --input-type=module -e \
            "import { computeNextBuildDigest } from './scripts/run-lighthouse.mjs'; process.stdout.write(computeNextBuildDigest())")"
          test "$actual" = "${{ needs.build.outputs.digest }}"

      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run median performance gate
        id: performance_gate
        run: npm run perf:fe
        env:
          PERF_BASE_SHA: ${{ steps.performance-base.outputs.sha }}
          PERF_BASELINE_SIZE_REPORT: .performance-baseline/route-sizes.json

      - name: Upload performance evidence
        if: ${{ !cancelled() && steps.performance_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-${{ github.sha }}
          path: |
            perf
            .performance-baseline/route-sizes.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Stop MongoDB
        if: ${{ always() }}
        run: bash scripts/ci-mongodb.sh stop

  dependency-review:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Review pull-request dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          config-file: ./.github/dependency-review-config.yml

      - name: Record non-PR applicability
        if: ${{ github.event_name != 'pull_request' }}
        run: echo 'Dependency delta review is not applicable outside pull_request events.'

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install exact dependency graph
        run: npm ci

      - name: Enforce scoped vulnerability policy
        run: npm run check:security-audit

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all reachable repository history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code=1
          --log-opts='--all' .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never

      - name: Enforce local CodeQL findings
        run: npm run check:codeql-sarif -- "${RUNNER_TEMP}/codeql-results"

      - name: Upload CodeQL evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 7

  production-gate:
    name: Production Gate
    if: ${{ always() }}
    needs:
      - actionlint
      - policy
      - static-analysis
      - unit-coverage
      - mutation
      - architecture
      - integration
      - build
      - e2e
      - performance
      - dependency-review
      - audit
      - secret-scan
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every production signal
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const results = JSON.parse(process.env.REQUIRED_RESULTS);
          const failures = Object.entries(results)
            .filter(([, value]) => value.result !== 'success')
            .map(([name, value]) => `${name}=${value.result}`);
          if (Object.keys(results).length !== 14) {
            failures.push(`expected 14 required jobs, received ${Object.keys(results).length}`);
          }
          if (failures.length > 0) {
            throw new Error(`Production Gate failed closed: ${failures.join(', ')}`);
          }
          process.stdout.write('Production Gate passed with 14/14 required jobs.\n');
          NODE
