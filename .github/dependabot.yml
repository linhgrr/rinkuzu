version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      stryker:
        patterns:
          - '@stryker-mutator/*'
        update-types:
          - major
          - minor
          - patch
      # vitest and its @vitest/* plugins pin each other as exact peers, so a
      # lone plugin bump fails `npm ci` with ERESOLVE (Dependabot #497, RIN-1588).
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - major
          - minor
          - patch
      gate-pinned-tools:
        patterns:
          - jscpd
          - '@redocly/cli'
          - prettier
          - react-doctor
          - knip
          - '@lhci/cli'
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        exclude-patterns:
          # Gate-pinned tools only ever come in the gate-pinned-tools group:
          # Dependabot does not keep a dependency out of a later group on
          # group order alone (#530 was folded into #560 and #570, RIN-1829).
          - jscpd
          - '@redocly/cli'
          - prettier
          - react-doctor
          - knip
          - '@lhci/cli'
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        exclude-patterns:
          # Gate-pinned tools only ever come in the gate-pinned-tools group:
          # Dependabot does not keep a dependency out of a later group on
          # group order alone (#530 was folded into #560 and #570, RIN-1829).
          - jscpd
          - '@redocly/cli'
          - prettier
          - react-doctor
          - knip
          - '@lhci/cli'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Ho_Chi_Minh
    groups:
      codeql:
        patterns:
          - 'github/codeql-action*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Ho_Chi_Minh
